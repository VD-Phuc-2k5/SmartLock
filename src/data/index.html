<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Smart Lock Setup</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 480px;
        margin: 40px auto;
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }

      label {
        display: block;
        margin-top: 16px;
        font-weight: 600;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      button {
        width: 100%;
        padding: 12px;
        margin-top: 22px;
        border: 0;
        border-radius: 8px;
        background: #111;
        color: #fff;
        font-size: 16px;
      }

      .danger {
        background: #c62828;
      }

      small {
        color: #666;
      }
    </style>
  </head>

  <body>
    <h1>Smart Lock Setup</h1>

    <form method="POST" action="/save">
      <label>Wi-Fi SSID</label>

      <input name="ssid" required placeholder="Wi-Fi network name" />

      <label>Wi-Fi Password</label>

      <input type="password" name="password" placeholder="Wi-Fi password" />

      <label>MQTT Broker</label>

      <input name="mqttHost" required placeholder="192.168.1.105" />

      <label>MQTT Port</label>

      <input
        type="number"
        name="mqttPort"
        min="1"
        max="65535"
        value="1883"
        required
      />

      <button type="submit">Save & Restart</button>
    </form>

    <form method="POST" action="/reset">
      <button type="submit" class="danger">Clear Configuration</button>
    </form>

    <p>
      <small>
        After saving, ESP32 will restart and connect using the saved
        configuration.
      </small>
    </p>
  </body>
</html>
